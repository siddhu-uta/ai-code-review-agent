AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI Code Review Agent — FastAPI + Claude tool use on Lambda + DynamoDB

# ── Parameters ───────────────────────────────────────────────────────────────
Parameters:
  ImageUri:
    Type: String
    Description: >
      ECR image URI for the Lambda function.
      Example: 123456789012.dkr.ecr.us-east-1.amazonaws.com/ai-code-review-agent:abc1234

  AnthropicApiKey:
    Type: String
    NoEcho: true
    Description: Anthropic API key (sk-ant-...)

  GithubToken:
    Type: String
    NoEcho: true
    Description: GitHub personal access token (ghp_...)

  ApiSecretKey:
    Type: String
    NoEcho: true
    Description: Secret sent in the X-API-Key request header

# ── Globals ──────────────────────────────────────────────────────────────────
Globals:
  Function:
    Timeout: 300        # 5 minutes — enough for any PR review
    MemorySize: 512

# ── Resources ────────────────────────────────────────────────────────────────
Resources:

  # DynamoDB table for review results
  ReviewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: code-reviews
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: review_id
          AttributeType: S
      KeySchema:
        - AttributeName: review_id
          KeyType: HASH

  # Lambda function (container image from ECR)
  CodeReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ai-code-review-agent
      PackageType: Image
      ImageUri: !Ref ImageUri
      Environment:
        Variables:
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          GITHUB_TOKEN: !Ref GithubToken
          API_SECRET_KEY: !Ref ApiSecretKey
          DYNAMODB_TABLE: code-reviews
          # AWS_REGION is injected automatically by the Lambda runtime
      Policies:
        # Read/write to our DynamoDB table
        - DynamoDBCrudPolicy:
            TableName: !Ref ReviewsTable
        # Self-invoke for async background processing
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:ai-code-review-agent"
      Events:
        # Catch-all proxy for all HTTP methods and paths
        HttpApiProxy:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        HttpApiRoot:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY

# ── Outputs ──────────────────────────────────────────────────────────────────
Outputs:
  ApiUrl:
    Description: Public API Gateway endpoint
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt CodeReviewFunction.Arn

  TableName:
    Description: DynamoDB table name
    Value: !Ref ReviewsTable
