AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI Code Review Agent — FastAPI + Claude (Bedrock) + Lambda + DynamoDB

# ── Parameters ───────────────────────────────────────────────────────────────
Parameters:
  ImageUri:
    Type: String
    Description: >
      ECR image URI for the Lambda function.
      Example: 123456789012.dkr.ecr.us-east-1.amazonaws.com/ai-code-review-agent:abc1234

  GithubToken:
    Type: String
    NoEcho: true
    Description: GitHub personal access token (ghp_...)

  ApiSecretKey:
    Type: String
    NoEcho: true
    Description: Secret sent in the X-API-Key request header

  BedrockModelId:
    Type: String
    Default: "us.anthropic.claude-sonnet-4-5-20250514-v1:0"
    Description: Bedrock cross-region inference model ID

# ── Globals ──────────────────────────────────────────────────────────────────
Globals:
  Function:
    Timeout: 300
    MemorySize: 512

# ── Resources ────────────────────────────────────────────────────────────────
Resources:

  ReviewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: code-reviews
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: review_id
          AttributeType: S
      KeySchema:
        - AttributeName: review_id
          KeyType: HASH

  CodeReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ai-code-review-agent
      PackageType: Image
      ImageUri: !Ref ImageUri
      Environment:
        Variables:
          GITHUB_TOKEN: !Ref GithubToken
          API_SECRET_KEY: !Ref ApiSecretKey
          DYNAMODB_TABLE: code-reviews
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReviewsTable
        # Invoke Claude via Bedrock (Resource: "*" is required — foundation model
        # ARNs are not account-scoped and can't be validated by CloudFormation)
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
        # Self-invoke for async background processing
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt CodeReviewFunction.Arn
      Events:
        HttpApiProxy:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        HttpApiRoot:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY

# ── Outputs ──────────────────────────────────────────────────────────────────
Outputs:
  ApiUrl:
    Description: Public API Gateway endpoint
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt CodeReviewFunction.Arn

  TableName:
    Description: DynamoDB table name
    Value: !Ref ReviewsTable
